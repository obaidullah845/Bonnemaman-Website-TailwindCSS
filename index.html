<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonne Maman</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body>
    <!-- header started -->
    <header class="fixed top-0 w-full bg-white lg:pb-5">
        <nav>
            <div class="flex justify-between px-4">
                <div class="flex items-center gap-4">
                    <p class="hidden lg:hidden xl:block xl:cursor-pointer text-[13px]">Contact us</p>
                    <img class="w-4.5 cursor-pointer xl:hidden" src="./src/assets/icons/menu-bars.png" alt="Bars">
                    <img class="w-4.5 cursor-pointer xl:hidden" src="./src/assets/icons/search.png" alt="Search">
                </div>
                <div>
                    <img class="w-35 xl:ml-20 cursor-pointer" src="./src/assets/images/nav-Logo.avif" alt="Logo">
                </div>
                <div class="flex items-center gap-3">
                    <div class="hidden lg:hidden xl:flex xl:items-center xl:gap-2 border border-gray-300 rounded-sm px-4 py-2 cursor-pointer">
                        <img class="w-4" src="src/assets/icons/search.png" alt="Search">
                        <p class="text-gray-600 text-[13.5px] font-semibold">Search</p>
                    </div>
                    <img class="w-5 cursor-pointer" src="./src/assets/icons/location.png" alt="Location">
                    <img class="w-5 cursor-pointer" src="./src/assets/icons/user.png" alt="User">
                    <img class="w-5 cursor-pointer" src="./src/assets/icons/shopping-bag.png" alt="Shopping-bag">
                </div>
            </div>
            <div class="hidden lg:block mt-4">
                <ul class="flex justify-center text-[13px] font-semibold gap-6">
                    <li><a class="hover:underline" href="#">Shop All</a></li>
                    <li><a class="text-red-600 hover:underline" href="#">E-Shop & Gifts</a></li>
                    <li><a class="hover:underline" href="#">Gift Ideas</a></li>
                    <li><a class="hover:underline" href="#">Recipes</a></li>
                    <li><a class="hover:underline" href="#">DIY & Tips</a></li>
                    <li><a class="hover:underline" href="#">Product Information</a></li>
                    <li><a class="hover:underline" href="#">Our Story</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <!-- header ended -->

    <!-- main started -->
    <main>
        
        <!-- section-1 started -->
        
        <!-- Mobile Screen -->
        <section class="lg:mt-32">
            <div class="h-125 bg-[url('./assets/images/section-1-mobile-img.webp')] bg-center bg-cover text-[#ffffff] lg:hidden xl:hidden">
                <div class="w-80 pt-82 pl-4">
                    <h1 class="text-4xl font-times">Made For You</h1>
                    <button class="px-6 py-4 text-[14px] bg-red-600 font-semibold mt-3 rounded-[7px]">Shop Now</button>
                </div>
            </div>
        </section>
        <!-- Mobile Screen -->

        <!-- Desktop Screen -->
        <section>
            <div class="h-128 xl:h-180 bg-[url('./assets/images/image1.webp')] bg-center bg-cover text-[#ffffff] mt-6 hidden lg:block xl:block">
                <div class="w-125 pt-44 pl-35">
                    <h1 class="text-[40px] font-times cursor-pointer">Made For You</h1>
                    <p class="cursor-pointer">8 mini jars packaged in a beautifully illustrated gift box for you or for someone you appreciate.</p>
                    <button class="px-6 py-4 text-[14px] bg-red-600 font-semibold mt-3 rounded-[7px] cursor-pointer">Shop Now</button>
                </div>
            </div>
        </section>      
        <!-- Desktop Screen -->
        
        <!-- section-1 ended -->






    <!-- npx @tailwindcss/cli -i ./src/input.css -o ./src/output.css --watch -->
</body>
</html>
